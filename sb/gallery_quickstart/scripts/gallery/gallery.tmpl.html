<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Gallery" }}</title>
  <style>
    :root{--bg:#0f1115;--fg:#e8eaed;--muted:#9aa0a6;--card:#151922;--acc:#4c8dff;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;}
    .wrap{max-width:1200px;margin:0 auto;padding:24px;}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
    header h1{font-size:1.25rem;margin:0;font-weight:650}
    header .meta{color:var(--muted);font-size:.95rem}
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
    .tile{position:relative;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 3px 16px rgba(0,0,0,.18);
          transition:transform .22s ease, box-shadow .22s ease;will-change:transform;text-decoration:none;color:inherit;}
    .tile:focus-within,.tile:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 10px 28px rgba(0,0,0,.28);}
    .tile img{width:100%;height:180px;object-fit:cover;display:block;transition:transform .5s ease;}
    .tile:hover img,.tile:focus-within img{transform:scale(1.06);}
    .tile__body{position:absolute;inset:auto 0 0 0;padding:14px 16px;color:#fff;
                background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.85) 100%);}
    .tile__title{font-size:1.05rem;font-weight:600;margin:0 0 6px;}
    .tile__meta{opacity:.85;font-size:.88rem;display:flex;gap:8px;align-items:center}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#1d2636;color:#cbd5e1;font-size:.75rem}
    .tier{position:absolute;top:10px;left:10px;background:#1c2434aa;padding:4px 8px;border-radius:8px;font-size:.75rem}
    .tile--locked::after{content:"Upgrade to view";position:absolute;inset:auto 0 0 0;padding:10px 12px;text-align:center;
                         background:rgba(0,0,0,.7);color:#fff;font-weight:600;}
    .tile--locked img{filter:blur(2px) grayscale(40%);}
    @media (prefers-reduced-motion: reduce){.tile,.tile img{transition:none;}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>{{ heading or "Latest Articles" }}</h1>
      <div class="meta">{{ articles|length }} items</div>
    </header>

    <div class="tiles">
      {% for a in articles %}
        <a class="tile {% if a.locked %}tile--locked{% endif %}" href="{{ a.href }}" data-tier="{{ a.tier }}" aria-label="Open: {{ a.title }}">
          {% if a.tier %}<span class="tier">{{ a.tier|capitalize }}</span>{% endif %}
          <img src="{{ a.thumb }}" alt="{{ a.alt or a.title }}">
          <div class="tile__body">
            <h3 class="tile__title">{{ a.title }}</h3>
            <div class="tile__meta">
              {% if a.minutes %}<span class="badge">{{ a.minutes }} min</span>{% endif %}
              {% if a.category %}<span>{{ a.category }}</span>{% endif %}
            </div>
          </div>
        </a>
      {% endfor %}
    </div>
  </div>
</body>
</html>
